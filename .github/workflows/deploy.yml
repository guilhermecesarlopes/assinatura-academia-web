name: Deploy

# main → staging automático. Produção: disparo manual com aprovação no Environment "production".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Ambiente
        type: choice
        options: [staging, production]
        default: production

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.target }}
    concurrency: deploy-${{ github.event_name == 'push' && 'staging' || inputs.target }}
    env:
      TARGET: ${{ github.event_name == 'push' && 'staging' || inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_* entra no bundle no build, então a URL da API é escolhida por ambiente aqui.
      - name: Build e deploy (Cloudflare Workers via OpenNext)
        run: |
          if [ "$TARGET" = "production" ]; then
            export NEXT_PUBLIC_API_URL="https://assinatura-academia-api.guilherme-lopes-08a.workers.dev"
          else
            export NEXT_PUBLIC_API_URL="https://assinatura-academia-api-staging.guilherme-lopes-08a.workers.dev"
          fi
          pnpm exec opennextjs-cloudflare build
          pnpm exec opennextjs-cloudflare deploy --env "$TARGET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
